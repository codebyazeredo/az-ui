<!doctype html>
<html lang="en" data-az-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foundations — AZ UI</title>
    <link rel="stylesheet" href="/src/styles/styles.css" />
    <link rel="stylesheet" href="/src/foundations/typography/fonts/ibm-plex-sans.css" />
    <link rel="stylesheet" href="/src/foundations/typography/fonts/source-sans-3.css" />
    <style>
      main {
        max-width: var(--az-max-width-xl);
        margin: 0 auto;
        padding: var(--az-spacing-6);
      }
      section {
        margin-bottom: var(--az-spacing-8);
      }
      h1,
      h2 {
        margin: 0 0 var(--az-spacing-3);
        font-weight: var(--az-font-weight-semibold);
      }
      h1 {
        font-size: var(--az-font-size-2xl);
      }
      h2 {
        font-size: var(--az-font-size-lg);
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: var(--az-spacing-2);
      }
      .swatch {
        width: 72px;
        font-size: var(--az-font-size-xs);
      }
      .swatch span {
        display: block;
        height: 36px;
        border: 1px solid var(--az-color-border);
        border-radius: var(--az-radius-sm);
      }
      .toolbar {
        display: flex;
        gap: var(--az-spacing-3);
        align-items: center;
        margin-bottom: var(--az-spacing-6);
      }
      .sample {
        padding: var(--az-spacing-4);
        background: var(--az-color-surface);
        border: 1px solid var(--az-color-border);
        border-radius: var(--az-radius-md);
        box-shadow: var(--az-shadow-sm);
      }
    </style>
  </head>
  <body class="az-body">
    <main>
      <h1>AZ UI Foundations</h1>

      <div class="toolbar">
        <label
          >Theme
          <select id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label
          >Font
          <select id="font">
            <option value="">Inter (default)</option>
            <option value="az-font-ibm-plex-sans">IBM Plex Sans</option>
            <option value="az-font-source-sans-3">Source Sans 3</option>
            <option value="az-font-system">System UI</option>
          </select>
        </label>
      </div>

      <section>
        <h2>Semantic colors</h2>
        <div class="swatches" id="semantic"></div>
      </section>

      <section>
        <h2>Scales</h2>
        <div id="scales"></div>
      </section>

      <section>
        <h2>Typography</h2>
        <div class="sample">
          <p class="az-text-lg az-fw-semibold az-m-0">Section title (lg, semibold)</p>
          <p class="az-text-md az-text-secondary az-mt-1">
            Secondary text at md size, used in tables and forms.
          </p>
          <p class="az-text-sm az-text-muted az-mt-1">Helper text (sm, muted) — 0123456789</p>
          <p class="az-mt-2">
            <span class="az-text-success">Success</span> ·
            <span class="az-text-warning">Warning</span> ·
            <span class="az-text-danger">Danger</span> ·
            <span class="az-text-brand">Brand</span>
          </p>
        </div>
      </section>

      <section>
        <h2>Responsive utilities</h2>
        <div class="sample az-d-flex az-flex-column az-md-flex-row az-gap-3">
          <div class="az-p-3 az-bg-muted az-border az-rounded-md">Column on small screens</div>
          <div class="az-p-3 az-bg-muted az-border az-rounded-md">Row from 768px</div>
        </div>
      </section>
    </main>

    <script>
      const root = document.documentElement;
      const semanticTokens = [
        "color-primary",
        "color-primary-hover",
        "color-secondary",
        "color-success",
        "color-warning",
        "color-danger",
        "color-info",
        "color-background",
        "color-surface",
        "color-surface-muted",
        "color-border",
        "color-border-strong",
        "text-primary",
        "text-secondary",
        "text-muted",
      ];
      const scaleNames = ["primary", "secondary", "success", "warning", "danger", "info", "gray"];
      const scaleSteps = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900];

      function renderSwatch(token) {
        return `<div class="swatch"><span style="background:var(--az-${token})"></span>${token}</div>`;
      }

      document.getElementById("semantic").innerHTML = semanticTokens.map(renderSwatch).join("");
      document.getElementById("scales").innerHTML = scaleNames
        .map(
          (name) =>
            `<div class="swatches az-mb-2">${scaleSteps.map((step) => renderSwatch(`${name}-${step}`)).join("")}</div>`,
        )
        .join("");

      document.getElementById("theme").addEventListener("change", (event) => {
        root.dataset.azTheme = event.target.value;
      });
      document.getElementById("font").addEventListener("change", (event) => {
        root.classList.remove("az-font-ibm-plex-sans", "az-font-source-sans-3", "az-font-system");
        if (event.target.value) root.classList.add(event.target.value);
      });
    </script>
  </body>
</html>
