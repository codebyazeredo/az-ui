<!doctype html>
<html lang="en" data-az-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — AZ UI example</title>
    <meta
      name="description"
      content="A centered sign-in form with error states built with AZ UI."
    />
    <script>
      (function () {
        var theme = localStorage.getItem("az-examples-theme");
        document.documentElement.dataset.azTheme =
          theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      })();
    </script>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles/styles.css" />
    <link rel="stylesheet" href="/examples/shared.css" />
  </head>
  <body class="az-body">
    <main class="sign-in">
      <div class="az-card sign-in-card">
        <div class="az-card-header">Sign in to Acme Operations</div>
        <form class="az-card-body az-stack" action="dashboard.html">
          <div class="az-alert az-alert-danger" role="alert">
            Check the highlighted field and try again.
          </div>
          <div class="az-field">
            <label class="az-field-label az-field-label-required" for="email">Email</label>
            <input
              class="az-control"
              id="email"
              name="email"
              type="email"
              value="ana@acme"
              autocomplete="username"
              required
              aria-invalid="true"
              aria-describedby="email-error"
            />
            <p class="az-field-error" id="email-error">
              Enter a complete address like ana@acme.com
            </p>
          </div>
          <div class="az-field">
            <label class="az-field-label az-field-label-required" for="password">Password</label>
            <input
              class="az-control"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="az-check">
            <input class="az-check-input" id="remember" name="remember" type="checkbox" />
            <label class="az-check-label" for="remember">Keep me signed in on this device</label>
          </div>
          <button class="az-btn az-btn-primary az-btn-lg" type="submit">Sign in</button>
        </form>
        <div class="az-card-footer az-d-flex az-justify-between az-text-sm">
          <a href="dashboard.html">Forgot your password?</a>
          <button class="az-btn az-btn-ghost az-btn-sm" type="button" data-example-theme-toggle>
            Toggle theme
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="/examples/shared.ts"></script>
  </body>
</html>
