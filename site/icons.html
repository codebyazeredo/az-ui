<!doctype html>
<html lang="en" data-az-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icon catalog — AZ UI</title>
    <meta
      name="description"
      content="Every built-in AZ UI icon, grouped by category. Search by name and click to copy."
    />
    <script>
      (function () {
        var theme = localStorage.getItem("az-docs-theme");
        document.documentElement.dataset.azTheme =
          theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      })();
    </script>
    <script type="module" src="/assets/docs.ts"></script>
    <script type="module" src="/assets/icons.ts"></script>
  </head>
  <body class="az-body">
    <main id="docs-content">
      <article class="docs-article">
        <h1>Icon catalog</h1>
        <p>
          <span id="icon-count"></span> functional icons on a 24×24 grid. They inherit the text
          color through <code>currentColor</code>. Click an icon to copy its name, then use it with
          <a href="docs/components/icon.html"><code>AZUI.Icon.create</code></a
          >.
        </p>

        <div class="az-field">
          <label class="az-field-label" for="icon-filter">Filter icons</label>
          <input class="az-control" id="icon-filter" type="search" placeholder="Search by name" />
        </div>
        <p class="az-text-sm az-text-muted" id="icon-status" role="status"></p>

        <div id="icon-catalog"></div>
      </article>
    </main>
  </body>
</html>
